name: Inspect VESPERA package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-vespera-package.yml"
      - "files/vespera-package.zip"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List archive contents
        shell: bash
        run: |
          set -euo pipefail
          test -s files/vespera-package.zip
          echo "=== ZIP CONTENTS ==="
          unzip -l files/vespera-package.zip
          mkdir -p "$RUNNER_TEMP/vespera-package"
          unzip -q files/vespera-package.zip -d "$RUNNER_TEMP/vespera-package"
          echo "=== EXTRACTED FILES ==="
          find "$RUNNER_TEMP/vespera-package" -type f -printf '%P | %s bytes\n' | sort
          echo "=== TOTAL SIZE ==="
          du -sh "$RUNNER_TEMP/vespera-package"
          echo "=== IMAGE METADATA ==="
          find "$RUNNER_TEMP/vespera-package" -type f \( -iname '*.webp' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0 | while IFS= read -r -d '' f; do
            file "$f"
          done

      - name: Upload extracted package for inspection
        uses: actions/upload-artifact@v4
        with:
          name: vespera-package-extracted
          path: ${{ runner.temp }}/vespera-package/
          if-no-files-found: error
          retention-days: 2
